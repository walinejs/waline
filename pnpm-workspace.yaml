packages:
  - docs
  - packages/*

allowBuilds:
  '@parcel/watcher': true
  core-js-pure: true
  esbuild: true
  sqlite3: true
  better-sqlite3: true
  unrs-resolver: true

catalog:
  marked: ^18.3.0
  sass-embedded: 1.108.2
  typescript: ^7.0.2
  vue: ^3.5.46
  vite: 8.3.8

virtualStoreType: global

minimumReleaseAgeExclude:
  - '@mdit/*'
  - '@mr-hope/*'
  - '@oxfmt/*'
  - '@oxlint/*'
  - '@oxlint-tsgolint/*'
  - '@vercel/*'
  - '@vitest/*'
  - '@vue/*'
  - '@vuepress/*'
  - '@waline/*'
  - 'oxc-config-hope'
  - 'oxfmt'
  - 'oxlint'
  - 'oxlint-tsgolint'
  - 'stylelint-config-hope'
  - 'tsdown'
  - 'vercel'
  - 'vitest'
  - 'vue'
  - 'vuepress'
  - 'vuepress-*'
  - '@types/node@22.20.7'

minimumReleaseAgeExcludePrune: true

overrides:
  # FIXME: vulnerable
  '@cloudbase/node-sdk>axios': 1.20.0
  # FIXME: https://github.com/next-theme/utils/issues/42
  '@next-theme/utils>js-yaml': ^5.0.0
  '@waline/api': workspace:*
  '@waline/client': workspace:*

packageExtensions:
  # FIXME: This is a bug in mathjax
  '@mathjax/mathjax-newcm-font':
    peerDependencies:
      '@mathjax/src': ^4.1.2

  # FIXME: This is a bug in mathjax
  '@mathjax/mathjax-tex-font':
    peerDependencies:
      '@mathjax/src': ^4.1.2

trustPolicy: no-downgrade
trustPolicyExclude:
  - vercel@67.0.0
trustPolicyIgnoreAfter: 720
trustPolicyExcludePrune: true
permissions:
  tsdown:
    skills: true
