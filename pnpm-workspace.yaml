packages:
  - docs
  - packages/*

allowBuilds:
  '@parcel/watcher': true
  core-js-pure: true
  esbuild: true
  sqlite3: true
  better-sqlite3: true
  unrs-resolver: true

catalog:
  typescript: ^6.0.3
  vue: ^3.5.42
  vite: 8.2.2

enableGlobalVirtualStore: true

minimumReleaseAgeExclude:
  - '@oxfmt/*'
  - '@oxlint/*'
  - '@oxlint-tsgolint/*'
  - '@mdit/*'
  - '@vercel/*'
  - '@vitest/*'
  - '@vue/*'
  - '@vuepress/*'
  - oxc-config-hope
  - oxfmt
  - oxlint
  - oxlint-tsgolint
  - tsdown
  - vercel
  - vitest
  - vue
  - vuepress-*
  - stylelint-config-hope

minimumReleaseAgeExcludePrune: true

overrides:
  # FIXME: vulnerable
  '@cloudbase/database>lodash.unset': ^4.18.0
  # FIXME: vulnerable
  '@cloudbase/node-sdk>axios': 1.18.0
  # FIXME: https://github.com/next-theme/utils/issues/42
  '@next-theme/utils>js-yaml': ^5.0.0
  '@waline/api': workspace:*
  '@waline/client': workspace:*
  '@xmldom/xmldom': ^0.9.10

packageExtensions:
  # FIXME: This is a bug in mathjax
  '@mathjax/mathjax-newcm-font':
    peerDependencies:
      '@mathjax/src': ^4.1.2

  # FIXME: This is a bug in mathjax
  '@mathjax/mathjax-tex-font':
    peerDependencies:
      '@mathjax/src': ^4.1.2

trustPolicy: no-downgrade

trustPolicyIgnoreAfter: 720
