name: 'publish @waline/admin'

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-admin.yml
      - packages/admin/**

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@^24.22.1
          require-lockfile: true

      - name: Build Admin
        run: pnpm run admin:build

      - name: Publish
        run: pnpm publish -r --filter @waline/admin --no-git-checks
