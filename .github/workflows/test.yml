name: Test

on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        node-version:
          - 22
          - 24
        os:
          - ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node-version }}

      - name: Install Dependencies
        run: pnpm ci

      - name: Package Build Test
        run: pnpm run build

      - name: Linter test
        run: pnpm run lint

      - name: Unit test
        run: pnpm run test

      - name: API Description Lint
        run: pnpm run api:lint

      - name: Docs Build Test
        run: pnpm run docs:build
